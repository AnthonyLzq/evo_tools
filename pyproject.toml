[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evo_tools"
version = "2.4.0"
description = "Evolutionary programming tools"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "AnthonyLzq (Anthony Luzquiños)", email = "sluzquinosa@uni.pe"},
]
dependencies = [
  "numpy",
  "sympy",
]
keywords = ["python", "evolutionary programming"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/AnthonyLzq/evo_tools"
Source = "https://github.com/AnthonyLzq/evo_tools"
Issues = "https://github.com/AnthonyLzq/evo_tools/issues"

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-mock",
  "scipy",
]

[tool.setuptools.packages.find]
include = ["evo_tools*"]

[tool.pytest.ini_options]
testpaths = ["test"]
